name: Open release docs PR

# Dispatched by the Port workflow `release_docs` once a human has approved the
# drafted artifacts. Everything here is mechanical — the writing already
# happened, and it was reviewed before this ran.
#
# Every input is passed through `env:` and never interpolated into a shell
# script with ${{ }}. The page bodies are Markdown full of backticks, quotes and
# parentheses; splicing them into bash is both a syntax error waiting to happen
# and a command injection hole.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release title, e.g. "order-api 2.4.0"
        required: true
      pr_title:
        description: Title for the docs PR
        required: true
      pr_body:
        description: Body for the docs PR
        required: true
      changelog_entry:
        description: Markdown block to prepend to the changelog
        required: true
      page_updates:
        description: JSON array of { identifier, path, content }
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create branch
        id: branch
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$RELEASE" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-')"
          branch="docs/${slug}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Apply page updates
        env:
          PAGE_UPDATES: ${{ inputs.page_updates }}
        run: |
          set -euo pipefail
          printf '%s' "$PAGE_UPDATES" > /tmp/updates.json

          if ! jq -e 'type == "array" and length > 0' /tmp/updates.json > /dev/null; then
            echo "page_updates must be a non-empty JSON array" >&2
            exit 1
          fi

          count="$(jq 'length' /tmp/updates.json)"
          for i in $(seq 0 $((count - 1))); do
            path="$(jq -r --argjson i "$i" '.[$i].path' /tmp/updates.json)"

            # Refuse anything that would write outside docs/.
            case "$path" in
              docs/*) ;;
              *) echo "refusing to write outside docs/: $path" >&2; exit 1 ;;
            esac
            case "$path" in
              *..*) echo "refusing path traversal: $path" >&2; exit 1 ;;
            esac

            mkdir -p "$(dirname "$path")"
            jq -r --argjson i "$i" '.[$i].content' /tmp/updates.json > "$path"
            echo "wrote $path"
          done

      - name: Prepend changelog entry
        env:
          CHANGELOG_ENTRY: ${{ inputs.changelog_entry }}
        run: |
          set -euo pipefail
          # The changelog keeps its frontmatter and H1; entries go below.
          head -n 8 docs/changelog.md > /tmp/changelog.new
          printf '\n%s\n' "$CHANGELOG_ENTRY" >> /tmp/changelog.new
          tail -n +9 docs/changelog.md >> /tmp/changelog.new
          mv /tmp/changelog.new docs/changelog.md

      - name: Commit and push
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          git config user.name "printf-release-bot"
          git config user.email "release-bot@printf.dev"
          git add -A
          if git diff --cached --quiet; then
            echo "no documentation changes to commit" >&2
            exit 1
          fi
          git commit -m "docs: $RELEASE"
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > /tmp/pr-body.md

          if ! gh pr create \
                --title "$PR_TITLE" \
                --body-file /tmp/pr-body.md \
                --base main \
                --head "$BRANCH" \
                --label documentation 2> /tmp/pr-error.txt; then

            cat /tmp/pr-error.txt >&2

            if grep -q 'not permitted to create or approve pull requests' /tmp/pr-error.txt; then
              cat >&2 <<'HINT'

          The branch pushed fine — only the pull request was refused.

          An org owner needs to enable, once:
            Organization Settings -> Actions -> General -> Workflow permissions
              [x] Read and write permissions
              [x] Allow GitHub Actions to create and approve pull requests

          Or, with an admin:org token:
            gh api -X PUT /orgs/$GITHUB_REPOSITORY_OWNER/actions/permissions/workflow \
              -f default_workflow_permissions=write \
              -F can_approve_pull_request_reviews=true
HINT
              echo "  Open it by hand meanwhile: https://github.com/$GITHUB_REPOSITORY/compare/$BRANCH?expand=1" >&2
            fi
            exit 1
          fi
